<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iCollect – Thẻ bóng đá chính hãng</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ===== CẤU HÌNH MÀU ===== */
:root{--blue:#6CABDD;--navy:#1C2C5B;--ink:#14213D;--bg:#fff;--soft:#F2F8FC;--line:#DCE9F3;--muted:#5C6F86;--sold:#9AA7B5}
*{box-sizing:border-box;margin:0}
body{font:16px/1.5 'Barlow',system-ui,sans-serif;color:var(--ink);background:var(--bg)}
h1,h2,h3,.price,.logo{font-family:'Barlow Condensed',sans-serif}
a{color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
header{background:var(--navy);color:#fff;position:sticky;top:0;z-index:20}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{font-size:30px;font-weight:700;letter-spacing:.5px;text-decoration:none}
.logo b{color:var(--blue)}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--blue);color:var(--navy);font-weight:600;padding:9px 18px;border-radius:999px;text-decoration:none;border:0;cursor:pointer;font:600 15px 'Barlow',sans-serif}
.btn:hover{background:#8bc0ea}
.hero{background:var(--navy);padding:34px 0 0;margin-bottom:64px}
.hero h1{color:#fff;font-size:clamp(34px,6vw,58px);line-height:1.02;max-width:640px;font-weight:700}
.hero p{color:#C9DBEE;max-width:520px;margin:12px 0 26px}
.tabs{position:relative;top:38px;display:flex;gap:6px;overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 8px 24px rgba(28,44,91,.12)}
.tab{flex:0 0 auto;border:0;background:none;padding:11px 20px;border-radius:9px;font:600 22px 'Barlow Condensed',sans-serif;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab[aria-selected=true]{background:var(--navy);color:#fff}
.tab:hover:not([aria-selected=true]){background:var(--soft);color:var(--navy)}
.bar{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0 12px}
.bar input,.bar select{font:16px 'Barlow',sans-serif;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.bar input{flex:1 1 220px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 14px;font:500 14px 'Barlow',sans-serif;cursor:pointer;color:var(--navy)}
.chip[aria-pressed=true]{background:var(--blue);border-color:var(--blue)}
.count{color:var(--muted);font-size:14px;margin:10px 0 14px}
.notice{background:var(--soft);border:1px solid var(--line);border-left:4px solid var(--blue);padding:10px 14px;border-radius:8px;margin-top:18px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:20px;padding-bottom:56px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;text-align:left;padding:0;font:inherit;color:inherit;display:flex;flex-direction:column;transition:border-color .15s}
.card:hover{border-color:var(--blue)}
.pic{position:relative;aspect-ratio:5/7;background:var(--soft)}
.pic img{width:100%;height:100%;object-fit:contain;display:block}
.tag{position:absolute;top:8px;left:8px;background:var(--navy);color:#fff;font-size:12px;font-weight:600;padding:2px 9px;border-radius:6px}
.rar{position:absolute;bottom:8px;left:8px;background:var(--blue);color:var(--navy);font-size:12px;font-weight:600;padding:2px 9px;border-radius:6px}
.sold .pic img{filter:grayscale(1);opacity:.5}
.sold .price{color:var(--sold);text-decoration:line-through}
.sold-badge{position:absolute;inset:auto 0 45% 0;text-align:center;background:rgba(28,44,91,.88);color:#fff;font:700 24px 'Barlow Condensed',sans-serif;padding:4px}
.info{padding:12px 14px 14px}
.info h3{font-size:22px;line-height:1.1;color:var(--navy)}
.info small{display:block;color:var(--muted);font-size:13px;margin:3px 0 8px}
.price{font-size:24px;font-weight:700;color:var(--navy)}
.empty{grid-column:1/-1;text-align:center;padding:60px 0;color:var(--muted)}
dialog{border:0;border-radius:16px;padding:0;max-width:820px;width:calc(100% - 28px);box-shadow:0 20px 60px rgba(20,33,61,.4)}
dialog::backdrop{background:rgba(20,33,61,.7)}
.lb{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.lb .pic{aspect-ratio:5/7;max-height:78vh;width:100%}
.lb .side{padding:24px;display:flex;flex-direction:column;gap:10px}
.lb h2{font-size:34px;line-height:1;color:var(--navy)}
.lb dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px}
.lb dt{color:var(--muted)}
.lb dd{margin:0;font-weight:500}
.lb .price{font-size:34px}
.x{position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:50%;border:0;background:#fff;font-size:22px;cursor:pointer;z-index:2}
.flip{align-self:flex-start;background:#fff;border:1px solid var(--line);padding:7px 14px;border-radius:999px;cursor:pointer;font:500 14px 'Barlow',sans-serif}
footer{background:var(--navy);color:#C9DBEE;padding:28px 0;font-size:14px}
@media(max-width:640px){.lb{grid-template-columns:1fr}.lb .pic{max-height:52vh}.grid{grid-template-columns:repeat(2,1fr);gap:12px}.info h3{font-size:19px}}
</style>
</head>
<body>
<header><div class="wrap">
  <a class="logo" href="#" id="logo">i<b>Collect</b></a>
  <a class="btn" id="fbTop" target="_blank" rel="noopener">Liên hệ Facebook</a>
</div></header>

<section class="hero"><div class="wrap">
  <h1>Thẻ bóng đá chính hãng</h1>
  <p>Topps, Panini, Daka, Futera. Xem ảnh và giá, nhắn Facebook để hỏi mua.</p>
  <div class="tabs" id="tabs" role="tablist" aria-label="Danh mục"></div>
</div></section>

<main class="wrap">
  <div id="notice"></div>
  <div class="bar">
    <input id="q" type="search" placeholder="Tìm cầu thủ, bộ sưu tập, số thẻ…" aria-label="Tìm kiếm">
    <select id="brand" aria-label="Hãng"></select>
    <select id="sort" aria-label="Sắp xếp">
      <option value="">Mặc định</option>
      <option value="asc">Giá thấp đến cao</option>
      <option value="desc">Giá cao đến thấp</option>
    </select>
  </div>
  <div class="chips" id="chips"></div>
  <p class="count" id="count"></p>
  <div class="grid" id="grid"></div>
</main>

<footer><div class="wrap">© iCollect. Trang chỉ giới thiệu hình ảnh và giá tham khảo, không thanh toán trực tuyến. Giá có thể thay đổi, vui lòng nhắn Facebook để xác nhận.</div></footer>

<dialog id="dlg"><button class="x" id="close" aria-label="Đóng">×</button><div class="lb" id="lb"></div></dialog>

<script>
/* ===== CẤU HÌNH – CHỈ SỬA PHẦN NÀY ===== */
const CONFIG = {
  // Dán link CSV của Google Sheets (File > Chia sẻ > Xuất bản lên web > CSV). Để trống = dùng dữ liệu mẫu.
  SHEET_CSV_URL: "https://docs.google.com/spreadsheets/d/e/2PACX-1vR1OIrKZunjDHkHAFGwdMgJIIIWXnxgjdD9lZmHcs7rKFFI6MbAdhjDyrTjAvk-3rokns4zsXhHQd9M/pub?gid=1630035941&single=true&output=csv",
  FACEBOOK_URL: "https://www.facebook.com/profile.php?id=100079612503859",
  // Thứ tự các mục lớn (phải trùng cột danh_muc trong Sheet)
  CATEGORIES: ["Câu lạc bộ", "Đội tuyển quốc gia", "Numbered", "Auto", "Supplies"]
};

const SAMPLE_CSV = `danh_muc,muc_nho,ten,hang,bo_suu_tap,mua_giai,so_the,do_hiem,tinh_trang,gia,trang_thai,anh,anh_sau
Câu lạc bộ,Man City,Erling Haaland,Topps,Topps Chrome UEFA Club Competitions,2023-24,#12,Base,Raw,350000,con,,
Câu lạc bộ,Man City,Phil Foden,Panini,Panini Prizm Premier League,2023-24,#88,Silver Prizm,Raw,900000,con,,
Câu lạc bộ,Real Madrid,Jude Bellingham,Panini,Panini Prizm La Liga,2023-24,#45,Rookie,Raw,1200000,con,,
Câu lạc bộ,Liverpool,Mohamed Salah,Futera,Futera Unique,2022,#31,Base,Raw,650000,con,,
Đội tuyển quốc gia,Việt Nam,Nguyễn Quang Hải,Daka,Daka Việt Nam,2023,#07,Base,Raw,150000,con,,
Đội tuyển quốc gia,Argentina,Lionel Messi,Panini,Panini Prestige FIFA World Cup,2022,#101,Base,Raw,500000,con,,
Numbered,Topps Chrome,Kylian Mbappé,Topps,Topps Chrome UEFA Club Competitions,2023-24,#9,Refractor /199,PSA 10,4500000,con,,
Numbered,Panini Prizm,Lamine Yamal,Panini,Panini Prizm La Liga,2023-24,#210,Gold /10,Raw,9800000,con,,
Auto,Rookie Auto,Cole Palmer,Topps,Topps Finest,2022-23,#CPA,Auto /50,BGS 9.5,6800000,con,,
Auto,Futera Auto,Bukayo Saka,Futera,Futera Unique,2022,#FA-12,Auto /25,Raw,5200000,dahban,,
Supplies,Toploader,Toploader 35pt (set 25 cái),-,,,,,,45000,con,,
Supplies,Sleeves,Sleeves bảo vệ thẻ (100 cái),-,,,,,,30000,con,,
`;

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const state = {cards: [], cat: "Tất cả", sub: "", q: "", brand: "", sort: ""};

function parseCSV(text){
  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){ if (c === '"'){ if (text[i+1] === '"'){ f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ","){ row.push(f); f = ""; }
    else if (c === "\n"){ row.push(f); rows.push(row); row = []; f = ""; }
    else if (c !== "\r") f += c;
  }
  if (f || row.length){ row.push(f); rows.push(row); }
  const head = rows.shift().map(h => h.trim().toLowerCase());
  return rows.filter(r => r.some(x => x.trim())).map(r => Object.fromEntries(head.map((h, i) => [h, (r[i] || "").trim()])));
}

function imgUrl(u){
  if (!u) return "";
  const m = u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=view&)?id=)([\w-]+)/);
  if (m) return `https://drive.google.com/thumbnail?id=${m[1]}&sz=w900`;
  return /^(https?:\/\/|[\w./-]+\.(jpe?g|png|webp|gif)$)/i.test(u) ? u : "";
}
function placeholder(name){
  const t = esc((name || "").slice(0, 22));
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 350"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6CABDD"/><stop offset="1" stop-color="#1C2C5B"/></linearGradient></defs><rect width="250" height="350" rx="14" fill="url(#g)"/><rect x="14" y="14" width="222" height="322" rx="8" fill="none" stroke="#fff" stroke-opacity=".5"/><circle cx="125" cy="140" r="52" fill="#fff" fill-opacity=".18"/><text x="125" y="290" fill="#fff" font-family="sans-serif" font-size="17" font-weight="700" text-anchor="middle">${t}</text><text x="125" y="318" fill="#fff" fill-opacity=".7" font-family="sans-serif" font-size="12" text-anchor="middle">Ảnh sẽ cập nhật</text></svg>`;
  return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
}
const isSold = c => /^(da ?ban|đã bán|het|hết|sold)/i.test(c.trang_thai || "");
function money(v){
  const n = Number(String(v).replace(/[^\d]/g, ""));
  return n ? n.toLocaleString("vi-VN") + "đ" : "Liên hệ";
}
const num = c => Number(String(c.gia).replace(/[^\d]/g, "")) || 0;

function norm(s){ return (s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/g, "d").toLowerCase(); }

function filtered(){
  let list = state.cards.filter(c =>
    (state.cat === "Tất cả" || c.danh_muc === state.cat) &&
    (!state.sub || c.muc_nho === state.sub) &&
    (!state.brand || c.hang === state.brand) &&
    (!state.q || norm([c.ten, c.hang, c.bo_suu_tap, c.mua_giai, c.so_the, c.do_hiem, c.muc_nho].join(" ")).includes(norm(state.q))));
  if (state.sort) list = [...list].sort((a, b) => state.sort === "asc" ? num(a) - num(b) : num(b) - num(a));
  return list;
}

function renderTabs(){
  const extra = [...new Set(state.cards.map(c => c.danh_muc))].filter(x => x && !CONFIG.CATEGORIES.includes(x));
  const cats = ["Tất cả", ...CONFIG.CATEGORIES, ...extra];
  $("#tabs").innerHTML = cats.map(c => `<button class="tab" role="tab" aria-selected="${c === state.cat}" data-c="${esc(c)}">${esc(c)}</button>`).join("");
}
function renderFilters(){
  const subs = [...new Set(state.cards.filter(c => state.cat === "Tất cả" || c.danh_muc === state.cat).map(c => c.muc_nho).filter(Boolean))];
  $("#chips").innerHTML = subs.length ? [`<button class="chip" aria-pressed="${!state.sub}" data-s="">Tất cả</button>`, ...subs.map(s => `<button class="chip" aria-pressed="${state.sub === s}" data-s="${esc(s)}">${esc(s)}</button>`)].join("") : "";
  const brands = [...new Set(state.cards.map(c => c.hang).filter(h => h && h !== "-"))];
  $("#brand").innerHTML = `<option value="">Tất cả hãng</option>` + brands.map(b => `<option ${b === state.brand ? "selected" : ""}>${esc(b)}</option>`).join("");
}
function renderGrid(){
  const list = filtered();
  $("#count").textContent = `${list.length} sản phẩm`;
  $("#grid").innerHTML = list.length ? list.map((c, i) => {
    const sold = isSold(c);
    return `<button class="card ${sold ? "sold" : ""}" data-i="${state.cards.indexOf(c)}">
      <div class="pic"><img loading="lazy" alt="${esc(c.ten)}" src="${esc(imgUrl(c.anh) || placeholder(c.ten))}" onerror="this.onerror=null;this.src='${placeholder(c.ten)}'">
      ${c.hang && c.hang !== "-" ? `<span class="tag">${esc(c.hang)}</span>` : ""}${c.do_hiem ? `<span class="rar">${esc(c.do_hiem)}</span>` : ""}${sold ? `<div class="sold-badge">ĐÃ BÁN</div>` : ""}</div>
      <div class="info"><h3>${esc(c.ten)}</h3><small>${esc([c.bo_suu_tap, c.mua_giai].filter(Boolean).join(", "))}</small><div class="price">${money(c.gia)}</div></div></button>`;
  }).join("") : `<div class="empty">Không tìm thấy sản phẩm phù hợp. Thử bỏ bớt bộ lọc.</div>`;
}
function render(){ renderTabs(); renderFilters(); renderGrid(); }

function openCard(i){
  const c = state.cards[i], front = imgUrl(c.anh) || placeholder(c.ten), back = imgUrl(c.anh_sau);
  const rows = [["Hãng", c.hang], ["Bộ sưu tập", c.bo_suu_tap], ["Mùa giải", c.mua_giai], ["Số thẻ", c.so_the], ["Độ hiếm", c.do_hiem], ["Tình trạng", c.tinh_trang]].filter(r => r[1] && r[1] !== "-");
  $("#lb").innerHTML = `<div class="pic"><img id="lbImg" alt="${esc(c.ten)}" src="${esc(front)}"></div>
    <div class="side"><h2>${esc(c.ten)}</h2>
    <dl>${rows.map(r => `<dt>${r[0]}</dt><dd>${esc(r[1])}</dd>`).join("")}</dl>
    <div class="price">${isSold(c) ? "Đã bán" : money(c.gia)}</div>
    ${back ? `<button class="flip" id="flip">Xem mặt sau</button>` : ""}
    <a class="btn" target="_blank" rel="noopener" href="${esc(CONFIG.FACEBOOK_URL)}">Hỏi mua qua Facebook</a></div>`;
  if (back){ let b = false; $("#flip").onclick = e => { b = !b; $("#lbImg").src = b ? back : front; e.target.textContent = b ? "Xem mặt trước" : "Xem mặt sau"; }; }
  $("#dlg").showModal();
}

$("#tabs").onclick = e => { const b = e.target.closest(".tab"); if (b){ state.cat = b.dataset.c; state.sub = ""; render(); } };
$("#chips").onclick = e => { const b = e.target.closest(".chip"); if (b){ state.sub = b.dataset.s; render(); } };
$("#grid").onclick = e => { const b = e.target.closest(".card"); if (b) openCard(+b.dataset.i); };
$("#q").oninput = e => { state.q = e.target.value; renderGrid(); };
$("#brand").onchange = e => { state.brand = e.target.value; renderGrid(); };
$("#sort").onchange = e => { state.sort = e.target.value; renderGrid(); };
$("#close").onclick = () => $("#dlg").close();
$("#dlg").onclick = e => { if (e.target.id === "dlg") e.target.close(); };
$("#fbTop").href = CONFIG.FACEBOOK_URL;

(async function init(){
  let csv = SAMPLE_CSV;
  if (CONFIG.SHEET_CSV_URL){
    try { const r = await fetch(CONFIG.SHEET_CSV_URL); if (!r.ok) throw 0; csv = await r.text(); }
    catch { $("#notice").innerHTML = `<div class="notice">Không tải được Google Sheets, đang hiển thị dữ liệu mẫu. Kiểm tra lại link CSV trong phần cấu hình.</div>`; }
  } else $("#notice").innerHTML = `<div class="notice">Đang hiển thị dữ liệu mẫu. Dán link Google Sheets vào <b>SHEET_CSV_URL</b> để dùng dữ liệu thật.</div>`;
  state.cards = parseCSV(csv);
  render();
})();
</script>
</body>
</html>
